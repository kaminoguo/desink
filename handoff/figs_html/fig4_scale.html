<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>body{margin:0;padding:20px;background:#fff;font-family:-apple-system,system-ui,sans-serif;}</style>
</head><body>
<div style="display:flex;gap:12px;width:1400px;">
<div style="flex:1;position:relative;height:380px;"><canvas id="s1"></canvas></div>
<div style="flex:1;position:relative;height:380px;"><canvas id="s2"></canvas></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<script>
Chart.register(ChartDataLabels);
const grid='rgba(0,0,0,0.06)',txt='#6b6a65',txtP='#2c2c2a',RED='#c0392b',GRN='#27ae60';

function mkData(layers,raw,ds){return{labels:layers,datasets:[{label:'Raw',data:raw.map(v=>Math.log10(Math.max(v,0.5))),backgroundColor:RED+'cc',borderRadius:3,barPercentage:0.8,categoryPercentage:0.7,datalabels:{display:false}},{label:'De-sinked',data:ds.map(v=>Math.log10(Math.max(v,0.5))),backgroundColor:GRN+'cc',borderRadius:3,barPercentage:0.8,categoryPercentage:0.7,datalabels:{display:function(ctx){const r=raw[ctx.dataIndex],d=ds[ctx.dataIndex];return r<20&&d>80;},formatter:function(v,ctx){return Math.round(ds[ctx.dataIndex]/raw[ctx.dataIndex])+'×';},color:GRN,font:{size:11,weight:700},anchor:'end',align:'top',offset:2}}]};}

const p6l=['L0','L4','L8','L12','L16','L20','L24','L28','L31'];
const p6r=[388.3,2.1,1.8,2.2,2.8,4.2,7.5,13.4,460.4],p6d=[736.9,1098.1,1298.4,1302.1,1199.1,960.4,787.3,745.9,568.3];
const gxl=['L0','L6','L12','L18','L24','L30','L36','L42','L47'];
const gxr=[408.5,406.2,1.8,1.8,2.5,4.5,9.1,10.1,461.6],gxd=[439.7,469.8,521.4,517.6,478.4,285.1,50.7,37.3,502.0];

const opts=(title)=>({responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{boxWidth:12,font:{size:12},color:txt,usePointStyle:true}},title:{display:true,text:title,font:{size:14,weight:600},color:txtP}},scales:{x:{grid:{display:false},ticks:{color:txt,font:{size:10}}},y:{grid:{color:grid},ticks:{color:txt,font:{size:11}},title:{display:true,text:'log₁₀(Effective rank)',color:txt,font:{size:12}},min:0}}});

new Chart(document.getElementById('s1'),{type:'bar',data:mkData(p6l,p6r,p6d),options:opts('Pythia-6.9B')});
new Chart(document.getElementById('s2'),{type:'bar',data:mkData(gxl,gxr,gxd),options:opts('GPT-2-XL (1.5B)')});
</script></body></html>
