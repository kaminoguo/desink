<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>body{margin:0;padding:20px;background:#fff;font-family:-apple-system,system-ui,sans-serif;}</style>
</head><body>
<div style="display:flex;gap:8px;width:1400px;">
<div style="flex:1;position:relative;height:380px;"><canvas id="c1"></canvas></div>
<div style="flex:1;position:relative;height:380px;"><canvas id="c2"></canvas></div>
<div style="flex:1;position:relative;height:380px;"><canvas id="c3"></canvas></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-annotation/3.0.1/chartjs-plugin-annotation.min.js"></script>
<script>
const grid='rgba(0,0,0,0.06)', txt='#6b6a65', txtP='#2c2c2a';
const RED='#c0392b', GRN='#27ae60', BLU='#2980b9';
const PH1='rgba(52,152,219,0.10)', PH23='rgba(231,76,60,0.08)';

const labels=['0','1','2','4','8','16','32','64','128','256','512','1k','2k','4k','8k','16k','32k','64k','128k','143k'];
const E1r=[.0529,.0529,.0529,.0529,.0529,.0526,.0545,.2702,.2261,.1303,.0712,.058,.0528,.2209,.3724,.5954,.6892,.7531,.7172,.6836];
const E1d=[.0425,.0425,.0425,.0425,.0427,.0434,.0455,.1327,.1641,.1151,.0663,.0429,.0384,.0426,.0539,.0652,.0733,.0716,.0738,.075];
const ERr=[178.2,178.2,178.2,178.2,178,176.9,171.9,60.9,45.8,78.7,125.6,175.6,207.1,119.8,59,17.3,9.6,6.4,7.6,9.2];
const ERd=[191.3,191.3,191.3,191.3,191.1,189.8,184.9,125.3,70.1,97,138,190.9,224.2,236.2,231.6,216.8,199.6,187.1,161,155.6];
const alpha=[1.24,1.24,1.24,1.24,1.24,1.21,1.06,1.07,1.14,1.21,1.24,1.24,1.95,3.28,4.68,6.33,8.85,10.31,9.89,9.59];
const k=0.0242;

const ann1={ph1:{type:'box',xMin:5,xMax:10,backgroundColor:PH1,borderWidth:0},ph23:{type:'box',xMin:12,xMax:19.5,backgroundColor:PH23,borderWidth:0},lb1:{type:'label',xValue:7.5,yValue:0.20,content:'Phase 1 (real)',font:{size:11,style:'italic'},color:'#2471a3'},lb2:{type:'label',xValue:15.5,yValue:0.20,content:'Phase 2–3 (phantom)',font:{size:11,style:'italic'},color:'#a93226'}};
const ann2={ph23:{type:'box',xMin:12,xMax:19.5,backgroundColor:PH23,borderWidth:0},lb3:{type:'label',xValue:16.5,yValue:40,content:['Rank "collapse"','(artifact)'],font:{size:11,style:'italic'},color:RED},lb4:{type:'label',xValue:13,yValue:210,content:['Rank growth','(real)'],font:{size:11,style:'italic'},color:GRN}};

new Chart(document.getElementById('c1'),{type:'line',data:{labels,datasets:[{label:'Raw',data:E1r,borderColor:RED,backgroundColor:RED+'33',pointRadius:3.5,pointBackgroundColor:RED,borderWidth:2,tension:0.1},{label:'De-sinked',data:E1d,borderColor:GRN,backgroundColor:GRN+'33',pointRadius:3.5,pointBackgroundColor:GRN,pointStyle:'rect',borderWidth:2,tension:0.1}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:true,position:'top',labels:{boxWidth:14,font:{size:12},color:txt,usePointStyle:true}},title:{display:true,text:'(a)  E₁: phantom phases vanish',font:{size:14,weight:600},color:txtP,padding:{bottom:10}},annotation:{annotations:ann1}},scales:{x:{grid:{color:grid},ticks:{color:txt,font:{size:10},maxRotation:45,autoSkip:true,maxTicksLimit:10},title:{display:true,text:'Training step',color:txt,font:{size:12}}},y:{grid:{color:grid},ticks:{color:txt,font:{size:11}},title:{display:true,text:'E₁ (1st PC variance share)',color:txt,font:{size:12}},min:-0.02,max:0.85}}}});

new Chart(document.getElementById('c2'),{type:'line',data:{labels,datasets:[{label:'Raw',data:ERr,borderColor:RED,backgroundColor:RED+'33',pointRadius:3.5,pointBackgroundColor:RED,borderWidth:2,tension:0.1},{label:'De-sinked',data:ERd,borderColor:GRN,backgroundColor:GRN+'33',pointRadius:3.5,pointBackgroundColor:GRN,pointStyle:'rect',borderWidth:2,tension:0.1}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:true,position:'top',labels:{boxWidth:14,font:{size:12},color:txt,usePointStyle:true}},title:{display:true,text:'(b)  Effective rank: collapse → growth',font:{size:14,weight:600},color:txtP,padding:{bottom:10}},annotation:{annotations:ann2}},scales:{x:{grid:{color:grid},ticks:{color:txt,font:{size:10},maxRotation:45,autoSkip:true,maxTicksLimit:10},title:{display:true,text:'Training step',color:txt,font:{size:12}}},y:{grid:{color:grid},ticks:{color:txt,font:{size:11}},title:{display:true,text:'Effective rank',color:txt,font:{size:12}}}}}});

const postIdx=[11,12,13,14,15,16,17,18,19],ph1Idx=[6,7,8,9,10],preIdx=[0,1,2,3,4,5];
const scatterPost=postIdx.map(i=>({x:alpha[i],y:E1r[i]}));
const scatterPh1=ph1Idx.map(i=>({x:alpha[i],y:E1r[i]}));
const scatterPre=preIdx.map(i=>({x:alpha[i],y:E1r[i]}));
const eps=0.055,theory=[];
for(let a=1.0;a<=12;a+=0.1){theory.push({x:a,y:(k*a*a+eps)/(k*a*a+1)});}

new Chart(document.getElementById('c3'),{type:'scatter',data:{datasets:[{label:'Theory',data:theory,type:'line',borderColor:BLU,borderWidth:2.5,pointRadius:0,tension:0.3,order:2},{label:'Post-Phase 1',data:scatterPost,backgroundColor:RED,pointRadius:6,pointHoverRadius:8,order:1},{label:'Phase 1 (transient)',data:scatterPh1,backgroundColor:'#e67e22',pointRadius:6,pointStyle:'triangle',pointHoverRadius:8,order:1},{label:'Pre-training',data:scatterPre,backgroundColor:'#999',pointRadius:4,pointStyle:'cross',pointHoverRadius:7,order:1}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:true,position:'top',labels:{boxWidth:12,font:{size:11},color:txt,usePointStyle:true}},title:{display:true,text:'(c)  Theorem 1 fit (R² = 0.978)',font:{size:14,weight:600},color:txtP,padding:{bottom:10}}},scales:{x:{type:'linear',grid:{color:grid},ticks:{color:txt,font:{size:11}},title:{display:true,text:'Sink strength α (norm ratio)',color:txt,font:{size:12}},min:0.8,max:12},y:{grid:{color:grid},ticks:{color:txt,font:{size:11}},title:{display:true,text:'E₁ (raw)',color:txt,font:{size:12}},min:0,max:0.85}}}});
</script></body></html>
